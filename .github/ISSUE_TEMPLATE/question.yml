name: Question
description: Ask about how something works, how to do X, or whether Lacunex supports Y.
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a question, please check:
        - The [README](../../README.md)
        - The [LICENSING](../../LICENSING.md) plain-English summary
        - [Existing issues](../../issues?q=is%3Aissue) for the same question
        - [GitHub Discussions](../../discussions) (better for open-ended questions)

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you trying to do? What did you check first?
    validations:
      required: false
