<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!--
    Lacunex app icon. Vermilion tile with the layered-paper glyph
    rotated -7 degrees in white. Self-contained contrast so it reads
    on light and dark OS chrome without per-mode variants.
    Matches the "iOS Light" variant in icon-prev.jsx.
  -->
  <defs>
    <linearGradient id="body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ff8458"/>
      <stop offset="0.55" stop-color="#ee5538"/>
      <stop offset="1" stop-color="#a83520"/>
    </linearGradient>
    <radialGradient id="topShine" cx="0.5" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomShade" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile body -->
  <rect x="0" y="0" width="40" height="40" rx="9" fill="url(#body)"/>
  <rect x="0" y="0" width="40" height="40" rx="9" fill="url(#topShine)"/>
  <rect x="0" y="0" width="40" height="40" rx="9" fill="url(#bottomShade)"/>
  <rect x="0.4" y="0.4" width="39.2" height="39.2" rx="8.6" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.4"/>

  <!-- Glyph: 80% scale, rotated -7deg, centered, white -->
  <g transform="translate(20 20) rotate(-7) scale(0.8) translate(-20 -20)">
    <rect x="4" y="7" width="24" height="29" rx="5" fill="#ffffff" opacity="0.18"/>
    <line x1="9.5"  y1="15" x2="22.5" y2="15" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    <line x1="9.5"  y1="20" x2="19"   y2="20" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
    <line x1="9.5"  y1="25" x2="20.5" y2="25" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.40"/>
    <rect x="12" y="4" width="24" height="29" rx="5" stroke="#ffffff" stroke-width="1.7" fill="none"/>
    <path d="M16 9 L32 9" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
    <circle cx="31.5" cy="28" r="2.4" fill="#ffffff" opacity="0.35"/>
    <circle cx="31.5" cy="28" r="1.5" fill="#ffffff"/>
  </g>
</svg>
